spring:
  cool-sms:
    api-key: ${COOL_SMS_API_KEY}
    api-secret: ${COOL_SMS_API_SECRET}
    caller-number: ${COOL_SMS_CALLER_NUMBER}

  cors:
    allowed-origins: ${ALLOWED_ORIGINS}


  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  jwt:
    secret: ${JWT_SECRET}

  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: ${NAVER_REDIRECT_URL}
            authorization-grant-type: authorization_code
            scope: [name, email, mobile]

          google:
            client-name: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URL}
            authorization-grant-type: authorization_code
            scope: [profile, email]

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri:        https://nid.naver.com/oauth2.0/token
            user-info-uri:    https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  forward-headers-strategy: native

portone:
  api-secret: ${PORTONE_API_SECRET}
  api-base:   ${PORTONE_API_BASE}
  webhook:
    secret:  ${WEBHOOK_V2_SECRET}

  cloud:
    aws:
      region:
        static: ap-northeast-2
      stack:
        auto: false
      parameterstore:
        enabled: true