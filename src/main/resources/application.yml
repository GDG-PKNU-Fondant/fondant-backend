spring:
  # ── 공통 SMS ────────────────────────────────────────
  cool-sms:
    api-key: ${COOL_SMS_API_KEY}
    api-secret: ${COOL_SMS_API_SECRET}
    caller-number: ${COOL_SMS_CALLER_NUMBER}

  # ── 공통 CORS ───────────────────────────────────────
  cors:
    allowed_origins: ${ALLOWED_ORIGINS}

  # ── 공통 Datasource (URL·계정만 환경변수) ───────────
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    # driver-class-name 은 각 프로필 파일에서 지정

  # ── JPA 기본값 ──────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update           # 기본은 update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # ── JWT ────────────────────────────────────────────
  jwt:
    secret: ${JWT_SECRET}

  # ── OAuth2 (NAVER / GOOGLE) ────────────────────────
  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: ${NAVER_REDIRECT_URL}
            authorization-grant-type: authorization_code
            scope: [name, email, mobile]

          google:
            client-name: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URL}
            authorization-grant-type: authorization_code
            scope: [profile, email]

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri:        https://nid.naver.com/oauth2.0/token
            user-info-uri:    https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
